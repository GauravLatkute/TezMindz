<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Select class — TezMindz</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/css/styles.css" />
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  </head>
  <body class="page">
    <header class="public-nav">
      <a class="logo" href="/"><span class="logo-mark">T</span> TezMindz</a>
    </header>
    <main class="auth-wrap" style="max-width: 520px">
      <h1>Which class are you in?</h1>
      <p class="muted" style="margin: 8px 0 22px">This sets your content, games, and TezBuddy’s language.</p>
      <div class="class-grid" id="classes"></div>
    </main>
    <script>
      {% if user_data_js %}
      window.USER_DATA = {{ user_data_js|safe }};
      {% endif %}
    </script>
    <script src="/static/js/store.js"></script>
    <script>
      var wrap = document.getElementById("classes");
      for (var i = 1; i <= 8; i++) {
        var a = document.createElement("a");
        a.href = "/dashboard/";
        a.className = "card class-card" + (i >= 5 ? " featured" : "");
        a.innerHTML = i + '<span>Class</span>';
        a.addEventListener(
          "click",
          (function (n) {
            return function (e) {
              e.preventDefault();
              fetch("/class/", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "X-CSRFToken": "{{ csrf_token }}"
                },
                body: JSON.stringify({ classLevel: n })
              })
              .then(function(res) {
                if (res.ok) return res.json();
                return res.json().then(function(err) { throw err; });
              })
              .then(function(data) {
                if (data.success) {
                  location.href = "/dashboard/";
                } else {
                  alert("Failed to set class.");
                }
              })
              .catch(function(err) {
                alert("Error setting class: " + (err.message || err));
              });
            };
          })(i)
        );
        wrap.appendChild(a);
      }
    </script>
  </body>
</html>
